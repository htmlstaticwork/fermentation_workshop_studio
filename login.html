<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FermentStudio</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="main.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
</head>
<body style="background: var(--bg-alt); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

    <div class="card reveal auth-card" style="max-width: 450px; width: 100%; padding: 3rem; text-align: center; position: relative;">

        <!-- Theme & RTL Toggles -->
        <div class="auth-toggles" style="position: absolute; top: 1.25rem; right: 1.25rem; display: flex; gap: 0.5rem;">
            <div id="theme-toggle" class="btn-icon" role="button" tabindex="0" title="Toggle Theme"><i data-lucide="moon"></i></div>
            <div id="rtl-toggle" class="btn-icon" role="button" tabindex="0" title="Toggle RTL"><i data-lucide="languages"></i></div>
        </div>

        <a href="index.html" class="flex-center" style="gap: 0.75rem; font-size: 1.75rem; font-weight: 800; color: var(--primary); margin-bottom: 2rem;">
            <img src="img/logo.svg" alt="Ferment Logo" style="height: 48px; width: 48px;">
            FERMENT
        </a>
        
        <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--text-alt); margin-bottom: 2.5rem;">Login to your workshop dashboard</p>

        <form style="text-align: left;">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div style="position: relative;">
                    <input type="password" class="form-input" placeholder="••••••••">
                    <button type="button" class="password-toggle" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-alt); cursor: pointer;">
                        <i data-lucide="eye" style="width: 20px; height: 20px;"></i>
                    </button>
                </div>
            </div>

            <div class="flex-between auth-meta" style="margin-bottom: 2.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text-alt);">
                    <input type="checkbox"> Remember Me
                </label>
                <a href="#" class="auth-link">Forgot Password?</a>
            </div>

            <button class="btn btn-primary" style="width: 100%; padding: 1rem; margin-bottom: 1.5rem;">Login</button>
            
            <div style="text-align: center; position: relative; margin-bottom: 1.5rem;">
                <span style="background: var(--bg-card); padding: 0 1rem; position: relative; z-index: 1; color: var(--text-alt); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Or continue with</span>
                <hr style="position: absolute; top: 50%; left: 0; width: 100%; border: none; border-top: 1px solid var(--border);">
            </div>

            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2.5rem;">
                <button type="button" class="btn-icon flex-center" style="padding: 0.75rem; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
                <button type="button" class="btn-icon flex-center" style="padding: 0.75rem; gap: 0.75rem;"><i data-lucide="apple" style="width: 18px;"></i> Apple</button>
            </div>

            <p style="text-align: center; color: var(--text-alt); font-size: 0.9rem;">Don't have an account? <a href="register.html" class="auth-link">Register Now</a></p>
        </form>
    </div>

    <style>
        .auth-link {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            position: relative;
            transition: color 0.25s ease, filter 0.25s ease;
        }
        .auth-link::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .auth-link:hover {
            filter: brightness(1.25);
            text-decoration: underline !important;
        }

        /* Mobile Adjustments for Auth Toggles Overlap */
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem !important;
                padding-top: 1.5rem !important; /* Standard padding */
                display: flex;
                flex-direction: column;
            }

            .auth-toggles {
                position: static !important;
                margin-bottom: 1rem !important;
                justify-content: center !important; /* Center toggles above logo */
                width: 100%;
                gap: 1rem !important;
            }
            
            .auth-toggles .btn-icon {
                width: 42px !important;
                height: 42px !important;
            }

            .auth-meta {
                flex-wrap: nowrap !important;
                gap: 0.5rem !important;
                white-space: nowrap !important;
            }

            .auth-meta label, .auth-meta a {
                font-size: 0.75rem !important;
            }
        }
    </style>

</body>
</html>
